# Postgres do Quitou. O mesmo arquivo sobe local e, depois, no VPS.
# No Mac a porta do host é 5435, só em 127.0.0.1, porque 5432 já está ocupada.
# Outro compose entra na rede quitou-db.

name: quitou

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-quitou}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - quitou_pg_data:/var/lib/postgresql/data
    networks:
      - quitou-db
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  quitou_pg_data:
    name: quitou_pg_data

networks:
  quitou-db:
    name: quitou-db
