<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 42px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.8px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 400; fill: #94a3b8; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
    .item-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #38bdf8; }
  </style>

  <!-- Container -->
  <rect width="960" height="220" rx="10" fill="url(#bg)" stroke="#1e293b" stroke-width="1" />

  <!-- Logo Icon -->
  <g transform="translate(48, 44)">
    <rect width="44" height="44" rx="10" fill="url(#markGrad)" />
    <!-- Checkmark Minimal -->
    <path d="M13 22 L19 28 L31 16" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Tagline -->
  <text x="108" y="70" class="title">Quitou</text>
  <text x="108" y="98" class="tagline">Checkout brasileiro e painel de pagamentos self-hosted com Pagar.me e Asaas.</text>

  <!-- Feature Grid / Realist Tech Stack (Clean Developer look) -->
  <g transform="translate(48, 136)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="195" height="52" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="24" class="item-title">Pix, Boleto &amp; Cartão</text>
      <text x="14" y="40" class="item-sub">Pagar.me + Asaas parcelado</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(215, 0)">
      <rect width="195" height="52" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="24" class="item-title">Docker Compose</text>
      <text x="14" y="40" class="item-sub">PostgreSQL 16 + Next.js 16</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(430, 0)">
      <rect width="195" height="52" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="24" class="item-title">White-Label</text>
      <text x="14" y="40" class="item-sub">Sua marca direto pelo .env</text>
    </g>

    <!-- Item 4: Run command box -->
    <g transform="translate(645, 0)">
      <rect width="215" height="52" rx="8" fill="#020617" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="23" class="code">$ cp .env.example .env</text>
      <text x="14" y="41" class="code">$ docker compose up -d</text>
    </g>
  </g>
</svg>
