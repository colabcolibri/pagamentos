<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="liBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="liEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="liCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 56px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
    .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 500; fill: #94a3b8; letter-spacing: -0.2px; }
    .t-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #10b981; letter-spacing: 0.8px; }
    .t-card-h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .t-card-p { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .t-pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
    .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #38bdf8; }
    .t-price { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 800; fill: #10b981; }
  </style>

  <!-- Deep Canvas -->
  <rect width="1200" height="628" fill="url(#liBg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="180" cy="180" r="180" fill="#059669" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1000" cy="400" r="220" fill="#0284c7" opacity="0.12" filter="url(#softGlow)" />

  <!-- Subtle Subtle Grid Lines -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="628" />
    <line x1="360" y1="0" x2="360" y2="628" />
    <line x1="600" y1="0" x2="600" y2="628" />
    <line x1="840" y1="0" x2="840" y2="628" />
    <line x1="1080" y1="0" x2="1080" y2="628" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- LEFT SECTION (Headline & Highlights) -->
  <g transform="translate(80, 80)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="16" r="4" fill="#10b981" />
    <text x="28" y="21" class="t-tag">OPEN SOURCE • SELF-HOSTED</text>

    <!-- Main Title with Icon -->
    <g transform="translate(0, 68)">
      <rect x="0" y="-42" width="48" height="48" rx="12" fill="url(#liEmerald)" />
      <path d="M14 -18 L21 -11 L34 -25" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="64" y="0" class="t-title">Quitou</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="145" class="t-sub">Checkout transparente e painel de pagamentos</text>
    <text x="0" y="176" class="t-sub" fill="#64748b" font-size="19px">para vender no seu próprio domínio sem intermediários.</text>

    <!-- Bullets / Feature Chips -->
    <g transform="translate(0, 240)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="16" y="27" class="t-pill">⚡ Pix, Boleto &amp; Cartão 12x</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(225, 0)">
        <rect width="235" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="16" y="27" class="t-pill">📄 Boleto Parcelado (Asaas)</text>
      </g>
    </g>

    <g transform="translate(0, 296)">
      <!-- Chip 3 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="16" y="27" class="t-pill">🐳 Docker Compose Ready</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(225, 0)">
        <rect width="235" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="16" y="27" class="t-pill">🤖 Servidor MCP Integrado</text>
      </g>
    </g>

    <!-- One Command Box -->
    <g transform="translate(0, 370)">
      <rect width="460" height="52" rx="10" fill="#020617" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="20" y="32" class="t-code">$ docker compose up --build -d</text>
    </g>
  </g>

  <!-- RIGHT SECTION (Realistic UI Mockup Card) -->
  <g transform="translate(640, 80)">
    <!-- Main Floating Window Card -->
    <rect width="480" height="468" rx="16" fill="url(#liCard)" stroke="#334155" stroke-width="1.2" />

    <!-- Card Window Header -->
    <circle cx="24" cy="24" r="5" fill="#ef4444" />
    <circle cx="40" cy="24" r="5" fill="#f59e0b" />
    <circle cx="56" cy="24" r="5" fill="#10b981" />
    <text x="80" y="28" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">checkout.seudominio.com</text>

    <!-- Checkout UI Mock Inside -->
    <g transform="translate(28, 54)">
      <!-- Product Summary Box -->
      <rect width="424" height="68" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="28" class="t-card-h">Formação Completa de TypeScript</text>
      <text x="16" y="48" class="t-card-p">Acesso vitalício • Encontros ao vivo • Certificado</text>
      <text x="320" y="44" class="t-price">R$ 497</text>

      <!-- Payment Method Selector -->
      <g transform="translate(0, 86)">
        <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5px">FORMA DE PAGAMENTO</text>

        <!-- Option: Pix Selected -->
        <g transform="translate(0, 28)">
          <rect width="134" height="60" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5" />
          <text x="14" y="26" class="t-card-h" fill="#34d399">Pix</text>
          <text x="14" y="44" class="t-card-p" fill="#10b981">Aprovação imediata</text>
        </g>

        <!-- Option: Cartao -->
        <g transform="translate(145, 28)">
          <rect width="134" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="14" y="26" class="t-card-h">Cartão</text>
          <text x="14" y="44" class="t-card-p">Até 12x</text>
        </g>

        <!-- Option: Boleto Parcelado -->
        <g transform="translate(290, 28)">
          <rect width="134" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="14" y="26" class="t-card-h">Carnê Asaas</text>
          <text x="14" y="44" class="t-card-p">Boleto parcelado</text>
        </g>
      </g>

      <!-- Customer Input Mock -->
      <g transform="translate(0, 196)">
        <rect width="424" height="42" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="26" class="t-card-p" fill="#475569">Nome completo do comprador...</text>
      </g>

      <g transform="translate(0, 248)">
        <rect width="424" height="42" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="26" class="t-card-p" fill="#475569">E-mail para receber o acesso...</text>
      </g>

      <!-- Pay Button Mock -->
      <g transform="translate(0, 310)">
        <rect width="424" height="48" rx="10" fill="url(#liEmerald)" />
        <text x="212" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Finalizar Pagamento Seguro →</text>
      </g>
    </g>
  </g>
</svg>
